<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scheduling System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Job Scheduling System</h1>
    </header>

    <section>
        <h2>Add a Job</h2>
        <form id="jobForm">
            <input type="number" id="jobId" placeholder="Job ID" required>
            <input type="number" id="priority" placeholder="Priority (Lower is Higher)" required>
            <input type="text" id="description" placeholder="Job Description" required>
            <button type="submit">Add Job</button>
        </form>
    </section>

    <section>
        <h2>Pending Jobs</h2>
        <ul id="jobList"></ul>
    </section>

    <button onclick="executeJob()">Execute Highest Priority Job</button>

    <script src="script.js"></script>
</body>
</html>
